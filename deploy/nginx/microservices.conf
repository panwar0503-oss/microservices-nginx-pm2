# -----------------------------------------------------------------------------
# Nginx reverse proxy for the three Node.js microservices.
#
# Deploy on the EC2 server as:
#   /etc/nginx/sites-available/microservices
# then enable with:
#   sudo ln -sf /etc/nginx/sites-available/microservices \
#               /etc/nginx/sites-enabled/microservices
#   sudo rm  -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing:
#   /api/users/*    -> 127.0.0.1:3001
#   /api/products/* -> 127.0.0.1:3002
#   /api/orders/*   -> 127.0.0.1:3003
#
# After certbot runs (Phase 21) it will REWRITE this file to add the TLS
# server block + auto-redirect from 80 -> 443. Keep server_name accurate
# for that to work.
# -----------------------------------------------------------------------------

# Upstreams keep pool config in one place and make it trivial to add
# more backends (e.g. multiple order-service instances) later.
upstream user_backend    { server 127.0.0.1:3001; keepalive 32; }
upstream product_backend { server 127.0.0.1:3002; keepalive 32; }
upstream order_backend   { server 127.0.0.1:3003; keepalive 32; }

server {
    listen      80;
    listen [::]:80;

    # Use _ (catch-all) until you have a real domain; replace with
    # api.example.com before running certbot in Phase 21.
    server_name _;

    # Dedicated log files so this app's traffic is easy to tail/rotate
    # separately from any other site on the box.
    access_log /var/log/nginx/microservices_access.log;
    error_log  /var/log/nginx/microservices_error.log warn;

    # Reasonable request-size cap. Bump if you ever accept file uploads.
    client_max_body_size 1m;

    # ---- Shared proxy behavior ------------------------------------------
    # HTTP/1.1 + empty Connection header are required for upstream
    # keepalive to actually be used (see the `keepalive` on each upstream).
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";

    # Preserve the original client details for the Node apps' access logs
    # and for any rate-limit / audit code they might add later.
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Fail fast on a dead / slow backend rather than tying up workers.
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # ---- Routing --------------------------------------------------------
    # Strip the /api/<service> prefix before forwarding, so upstream sees
    # /health, /users, /users/1 — exactly the paths the Node app defines.
    #
    # Trailing slash matters:
    #   location /api/users/  { proxy_pass http://user_backend/; }
    #                                                       ^ strip prefix
    # This is the #1 nginx routing gotcha — see README troubleshooting.

    location /api/users/ {
        proxy_pass http://user_backend/;
    }

    location /api/products/ {
        proxy_pass http://product_backend/;
    }

    location /api/orders/ {
        proxy_pass http://order_backend/;
    }

    # Optional: a root probe so you can hit the box directly and know
    # nginx itself is alive even if every upstream is down.
    location = / {
        return 200 "microservices gateway ok\n";
        add_header Content-Type text/plain;
    }
}
